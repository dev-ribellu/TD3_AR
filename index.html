<!DOCTYPE html>
<html lang="en">
  <head>
    <title>three.js ar - hit test</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link type="text/css" rel="stylesheet" href="main.css" />
  </head>
  <body>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./build/three.module.js",
          "three/addons/": "./jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";

      import { ARButton } from "three/addons/webxr/ARButton.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
      import { MTLLoader } from "three/addons/loaders/MTLLoader.js";
      import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

      let reticle, pmremGenerator, current_object, controls, envmap;

      let container;
      let camera, scene, renderer;
      let controller1, controller2;

      let hitTestSource = null;
      let hitTestSourceRequested = false;
      let current_url = "";
      $(".ar-object").click(function () {
        // update current object url
        current_url = $(this).attr("id");
        // load object in scene only when the AR is not started
        if (!renderer.xr.isPresenting) {
          if (current_object != null) {
            scene.remove(current_object);
          }
          loadModel(current_url);
        }
      });

      function loadModel(model) {
        new RGBELoader()
          .setDataType(THREE.HalfFloatType)
          .setPath("textures/") // supprimer cette ligne sous Glitch
          .load("rocky_terrain_4k.gltf", function (texture) {
            envmap = pmremGenerator.fromEquirectangular(texture).texture;
            texture.flipY = false;
            texture.premultiplyAlpha = false;
            scene.environment = envmap;
            texture.dispose();
            pmremGenerator.dispose();
            render();
            var loader = new GLTFLoader().setPath("3d/");
          });
      }

      init();

      function init() {
        container = document.createElement("div");
        document.body.appendChild(container);

        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          0.01,
          20
        );

        pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
        light.position.set(0.5, 1, 0.25);
        scene.add(light);

		var directionalLight = new THREE.DirectionalLight(0xdddddd, 1);
		directionalLight.position.set(0, 0, 1).normalize();
		scene.add(directionalLight);
		var ambientLight = new THREE.AmbientLight(0x222222);
		scene.add(ambientLight);


        //

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setAnimationLoop(animate);
        renderer.xr.enabled = true;
        container.appendChild(renderer.domElement);

        //

        document.body.appendChild(
          ARButton.createButton(renderer, { requiredFeatures: ["hit-test"] })
        );

        //

        const geometry = new THREE.CylinderGeometry(
          0.1,
          0.1,
          0.2,
          32
        ).translate(0, 0.1, 0);

        function onSelect() {
          if (reticle.visible) {
            const material = new THREE.MeshPhongMaterial({
              color: 0xffffff * Math.random(),
            });
            const mesh = new THREE.Mesh(geometry, material);
            reticle.matrix.decompose(
              mesh.position,
              mesh.quaternion,
              mesh.scale
            );
            mesh.scale.y = Math.random() * 2 + 1;
            scene.add(mesh);
          }
        }

        controller1 = renderer.xr.getController(0);
        controller1.addEventListener("select", onSelect);
        scene.add(controller1);

        controller2 = renderer.xr.getController(1);
        controller2.addEventListener("select", onSelect);
        scene.add(controller2);

        reticle = new THREE.Mesh(
          new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial()
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        //

        window.addEventListener("resize", onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      //

      function animate(timestamp, frame) {
        if (frame) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const session = renderer.xr.getSession();

          if (hitTestSourceRequested === false) {
            session
              .requestReferenceSpace("viewer")
              .then(function (referenceSpace) {
                session
                  .requestHitTestSource({ space: referenceSpace })
                  .then(function (source) {
                    hitTestSource = source;
                  });
              });

            session.addEventListener("end", function () {
              hitTestSourceRequested = false;
              hitTestSource = null;
            });

            hitTestSourceRequested = true;
          }

          if (hitTestSource) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);

            if (hitTestResults.length) {
              const hit = hitTestResults[0];

              reticle.visible = true;
              reticle.matrix.fromArray(
                hit.getPose(referenceSpace).transform.matrix
              );
            } else {
              reticle.visible = false;
            }
          }
        }

        renderer.render(scene, camera);
      }
    </script>
    <script>
      function openNav() {
        document.getElementById("mySidenav").style.width = "250px";
      }

      function closeNav() {
        document.getElementById("mySidenav").style.width = "0";
      }
    </script>
    <div id="content">
      <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()"
          >&times;</a
        >
        <a class="ar-object" id="1" href="#">item_1</a>
        <a class="ar-object" id="2" href="#">item_2</a>
        <a class="ar-object" id="3" href="#">item_3</a>
        <a class="ar-object" id="4" href="#">item_4</a>
      </div>
      <div id="container" style="position: fixed"></div>
      <span
        style="font-size: 30px; cursor: pointer; position: absolute"
        onclick="openNav()"
        >&#9776; open</span
      >
    </div>
  </body>
</html>
